<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suite logique</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0057b8 0%, #00a2ff 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 36px 32px;
    width: 100%;
    max-width: 540px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.22);
  }

  /* ── En-tête ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .badge-question {
    font-size: 13px;
    font-weight: 700;
    color: #00a2ff;
    background: #e8f4ff;
    padding: 5px 14px;
    border-radius: 20px;
  }
  .progress-bar-wrap {
    flex: 1;
    margin: 0 16px;
    height: 8px;
    background: #e5e7eb;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #00a2ff, #0057b8);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .badge-score {
    font-size: 13px;
    font-weight: 700;
    color: #374151;
  }

  /* ── Question ── */
  .question-title {
    font-size: 13px;
    font-weight: 600;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-bottom: 10px;
  }
  .question-text {
    font-size: 17px;
    font-weight: 700;
    color: #1f2933;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  /* ── Séquence ── */
  .sequence {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .seq-item {
    width: 54px;
    height: 54px;
    border-radius: 12px;
    background: #f0f6ff;
    border: 2px solid #cce1ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    color: #0057b8;
  }
  .seq-item.blank {
    background: #fff3e0;
    border: 2px dashed #f59e0b;
    color: #f59e0b;
    font-size: 26px;
  }
  .seq-arrow {
    color: #9ca3af;
    font-size: 18px;
    font-weight: 300;
  }

  /* ── Choix ── */
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .choice {
    padding: 14px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    color: #374151;
    background: #fff;
    cursor: pointer;
    text-align: center;
    transition: all .18s;
    user-select: none;
  }
  .choice:hover { border-color: #00a2ff; background: #f0f9ff; color: #0057b8; }
  .choice.selected { border-color: #00a2ff; background: #e8f4ff; color: #0057b8; }
  .choice.disabled { cursor: not-allowed; }

  /* ── Feedback ── */
  .feedback { display: none; }

  /* ── Bouton suivant ── */
  .btn-next {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #00a2ff, #0057b8);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .04em;
    transition: opacity .2s, transform .1s;
  }
  .btn-next:hover  { opacity: .92; transform: translateY(-1px); }
  .btn-next:active { transform: translateY(0); }
  .btn-next:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* ── Écran résultat ── */
  .result-screen {
    text-align: center;
    display: none;
  }
  .result-icon {
    font-size: 64px;
    margin-bottom: 16px;
  }
  .result-title {
    font-size: 26px;
    font-weight: 800;
    color: #1f2933;
    margin-bottom: 8px;
  }
  .result-score-big {
    font-size: 64px;
    font-weight: 900;
    color: #00a2ff;
    line-height: 1;
    margin: 12px 0;
  }
  .result-sub {
    font-size: 15px;
    color: #6b7280;
    margin-bottom: 28px;
  }
  .result-detail {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 28px;
  }
  .result-stat { text-align: center; }
  .result-stat .val { font-size: 28px; font-weight: 800; color: #1f2933; }
  .result-stat .lbl { font-size: 12px; color: #9ca3af; text-transform: uppercase; font-weight: 600; }
  .btn-submit {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #00a2ff, #0057b8);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .04em;
    transition: opacity .2s;
  }
  .btn-submit:hover { opacity: .9; }
</style>
</head>
<body>

<div class="card">

  <!-- ── Jeu ── -->
  <div id="game-screen">
    <div class="header">
      <span class="badge-question" id="badge-q">1 / 5</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress" style="width:0%"></div>
      </div>
      <span class="badge-score" id="badge-score" style="display:none"></span>
    </div>

    <div class="question-title">Suite logique</div>
    <div class="question-text" id="question-text"></div>

    <div class="sequence" id="sequence"></div>

    <div class="choices" id="choices"></div>

    <div class="feedback" id="feedback"></div>

    <button class="btn-next" id="btn-next" disabled>Suivant →</button>
  </div>

  <!-- ── Envoi ── -->
  <div class="result-screen" id="result-screen" style="padding:40px 0;">
    <div style="font-size:48px;margin-bottom:16px;">✅</div>
    <div style="font-size:20px;font-weight:800;color:#1f2933;margin-bottom:8px;">Test terminé</div>
    <div style="font-size:14px;color:#6b7280;margin-bottom:32px;">Envoi de vos réponses en cours…</div>
  </div>

</div>

<script>
const QUESTIONS = [
  {
    texte: "Quelle est la valeur manquante dans cette suite ?",
    sequence: [2, 4, 6, 8, '?'],
    reponse: 10,
    choix: [7, 9, 10, 12],
    explication: "Suite +2 : 2, 4, 6, 8, 10"
  },
  {
    texte: "Complétez la suite de carrés parfaits.",
    sequence: [1, 4, 9, 16, '?'],
    reponse: 25,
    choix: [20, 24, 25, 32],
    explication: "1², 2², 3², 4², 5² = 25"
  },
  {
    texte: "Quelle est la prochaine valeur dans la suite de Fibonacci ?",
    sequence: [1, 1, 2, 3, 5, '?'],
    reponse: 8,
    choix: [6, 7, 8, 10],
    explication: "Chaque terme = somme des deux précédents : 3 + 5 = 8"
  },
  {
    texte: "Suite décroissante — trouvez la valeur manquante.",
    sequence: [20, 15, 10, 5, '?'],
    reponse: 0,
    choix: [-5, 0, 1, 3],
    explication: "Suite −5 : 20, 15, 10, 5, 0"
  },
  {
    texte: "Chaque terme est multiplié par 3. Trouvez la suite.",
    sequence: [2, 6, 18, 54, '?'],
    reponse: 162,
    choix: [108, 144, 162, 180],
    explication: "Suite ×3 : 54 × 3 = 162"
  }
];

let current   = 0;
let correct   = 0;
let answered  = false;

const gameScreen   = document.getElementById('game-screen');
const resultScreen = document.getElementById('result-screen');
const badgeQ       = document.getElementById('badge-q');
const badgeScore   = document.getElementById('badge-score');
const progressBar  = document.getElementById('progress');
const questionText = document.getElementById('question-text');
const sequenceEl   = document.getElementById('sequence');
const choicesEl    = document.getElementById('choices');
const feedbackEl   = document.getElementById('feedback');
const btnNext      = document.getElementById('btn-next');

function afficherQuestion() {
  const q  = QUESTIONS[current];
  answered = false;

  badgeQ.textContent    = `${current + 1} / ${QUESTIONS.length}`;
  progressBar.style.width = (current / QUESTIONS.length * 100) + '%';
  questionText.textContent = q.texte;
  feedbackEl.textContent   = '';
  feedbackEl.className     = 'feedback';
  btnNext.disabled = true;
  btnNext.textContent = current === QUESTIONS.length - 1 ? 'Terminer le test →' : 'Suivant →';

  // Séquence
  sequenceEl.innerHTML = '';
  q.sequence.forEach((val, i) => {
    if (i > 0) {
      const arrow = document.createElement('span');
      arrow.className   = 'seq-arrow';
      arrow.textContent = '›';
      sequenceEl.appendChild(arrow);
    }
    const item = document.createElement('div');
    item.className = val === '?' ? 'seq-item blank' : 'seq-item';
    item.textContent = val;
    sequenceEl.appendChild(item);
  });

  // Choix mélangés
  const choixMelanges = [...q.choix].sort(() => Math.random() - .5);
  choicesEl.innerHTML = '';
  choixMelanges.forEach(val => {
    const btn = document.createElement('button');
    btn.className   = 'choice';
    btn.textContent = val;
    btn.addEventListener('click', () => choisir(btn, val, q));
    choicesEl.appendChild(btn);
  });
}

function choisir(btn, val, q) {
  if (answered) return;
  answered = true;

  document.querySelectorAll('.choice').forEach(b => b.classList.add('disabled'));
  btn.classList.add('selected');

  if (val === q.reponse) correct++;

  btnNext.disabled = false;
}

btnNext.addEventListener('click', () => {
  current++;
  if (current < QUESTIONS.length) {
    afficherQuestion();
  } else {
    soumettre();
  }
});

function soumettre() {
  const score = Math.round((correct / QUESTIONS.length) * 100);
  gameScreen.style.display   = 'none';
  resultScreen.style.display = 'block';

  if (typeof CodeWarden !== 'undefined') {
    CodeWarden.submit(score);
  } else {
    alert('Score : ' + score + '/100\n(CodeWarden non disponible en mode standalone)');
  }
}

// Démarrage
afficherQuestion();
</script>
</body>
</html>
